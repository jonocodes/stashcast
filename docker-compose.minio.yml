# Opt-in override: store published media in a local MinIO bucket instead of local disk.
#
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up --build
#   (or: just dev-docker-s3)
#
# Media is then served to podcast apps straight from http://localhost:9000/stashcast/...
# MinIO console: http://localhost:9001 (stashcast / stashcast-dev)

x-s3-env: &s3-env
  STASHCAST_S3_BUCKET: stashcast
  STASHCAST_S3_ENDPOINT_URL: http://minio:9000
  STASHCAST_S3_REGION: us-east-1
  STASHCAST_S3_ACCESS_KEY_ID: stashcast
  STASHCAST_S3_SECRET_ACCESS_KEY: stashcast-dev
  # Public URL podcast apps/browsers use, so it must be reachable from outside compose
  STASHCAST_MEDIA_BASE_URL: http://localhost:9000/stashcast

services:
  minio:
    # Community build; upstream MinIO stopped publishing images in 2025
    image: pgsty/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: stashcast
      MINIO_ROOT_PASSWORD: stashcast-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data_docker/minio:/data

  minio-init:
    build: .
    command: python scripts/s3_dev_init.py
    environment: *s3-env
    depends_on:
      - minio
    restart: "no"

  web:
    environment:
      STASHCAST_DATA_DIR: /app/data_docker
      <<: *s3-env
    depends_on:
      - minio-init

  worker:
    environment:
      STASHCAST_DATA_DIR: /app/data_docker
      <<: *s3-env
    depends_on:
      - minio-init
