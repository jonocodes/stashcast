name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Lets the Docker workflow run the tests before publishing an image
  workflow_call:

jobs:
  lockfile:
    # uv.lock must match pyproject.toml, and requirements*.txt must match uv.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-uv publishes no floating major tags, so pin the commit
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Check requirements files match uv.lock
        run: |
          scripts/export-requirements.sh
          if ! git diff --exit-code requirements.txt requirements-dev.txt; then
            echo "::error::requirements*.txt are out of date. Run 'just lock' and commit the changes."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    env:
      STASHCAST_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          cp .env.example .env

      - name: Prepare data directory
        run: mkdir -p "$STASHCAST_DATA_DIR"

      - name: Install gettext for translations
        run: sudo apt-get install -y gettext

      - name: Check translations are up to date
        run: |
          python manage.py makemessages -a --no-obsolete
          if ! git diff --exit-code locale/; then
            echo "::error::Translation files are out of date. Run 'python manage.py makemessages -a --no-obsolete' and commit the changes."
            exit 1
          fi

      - name: Compile translations
        run: python manage.py compilemessages --ignore=.flox

      - name: Run tests with coverage
        run: coverage run -m pytest

      - name: Report coverage
        run: coverage report -m
